name: Bug report
description: Help reproduce something that is not working.
title: "[Bug] "
body:
  - type: dropdown
    id: path
    attributes:
      label: Where did this happen?
      options:
        - Credential-free simulated sample
        - Full application with real models
        - Local setup or documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use fictional data. Omit credentials, real transcripts and meeting invitation links.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser/version, operating system, commit or deployed version
  - type: textarea
    id: evidence
    attributes:
      label: Safe screenshots or diagnostics
      description: Redact personal information and secrets. Security issues should follow SECURITY.md.
