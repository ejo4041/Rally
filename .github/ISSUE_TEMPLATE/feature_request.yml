name: Feature request
description: Propose a focused improvement.
title: "[Idea] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should Rally solve?
      description: Describe the meeting workflow and who benefits.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed behavior and success criteria
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or existing workarounds
